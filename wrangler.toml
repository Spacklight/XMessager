name = "xmessager-backend"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Optional KV namespace for fast video metadata listing.
# Create it with: wrangler kv namespace create VIDEO_KV
# then paste the id below (and uncomment).
# [[kv_namespaces]]
# binding = "VIDEO_KV"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Non-secret vars go here. HF_TOKEN must NOT go here — it goes in as a
# Cloudflare *secret* instead (we'll set that in the dashboard later).
[vars]
HF_DATASET_REPO = "Spacklight/Video-data"
